name: Build GDMusic IPA (unsigned)

# 在 GitHub 云端 macOS runner 上用 XcodeGen 生成 Xcode 工程并构建
# music.gdstudio.xyz 的 WKWebView 外壳，产出【未签名】IPA。
# 无需 Mac、无需付费 Apple 开发者账号。
# 产物用 Sideloadly/AltStore + 普通 Apple ID 自签安装（7 天有效）。

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/ios-ipa.yml'
      - 'project.yml'
      - 'App/**'

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned XcodeGen (2.38.0)
        run: |
          # 2.38.0 生成 Xcode 15 可读取的工程格式（object version 56）
          brew install xcodegen
          curl -sSL https://github.com/yonaskolb/XcodeGen/releases/download/2.38.0/xcodegen.zip -o /tmp/xcodegen.zip
          unzip -o /tmp/xcodegen.zip -d /tmp/xg
          /tmp/xg/xcodegen --version

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: /tmp/xg/xcodegen generate

      - name: Archive (CODE_SIGNING_ALLOWED=NO)
        run: |
          set -o pipefail
          xcodebuild \
            -project GDMusic.xcodeproj \
            -scheme GDMusic \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/GDMusic.xcarchive \
            -derivedDataPath $PWD/build/derived \
            clean archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH=$(find "$PWD/build/GDMusic.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::未找到 .app，archive 可能失败"
            exit 1
          fi
          echo "Found app: $APP_PATH"
          mkdir -p "$PWD/build/Payload"
          cp -r "$APP_PATH" "$PWD/build/Payload/"
          cd "$PWD/build"
          zip -qr "GDMusic-1.2.0-unsigned.ipa" Payload
          shasum -a 256 "GDMusic-1.2.0-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GDMusic-unsigned-ipa
          path: build/*-unsigned.ipa
          retention-days: 14
          if-no-files-found: error
